<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PETYA</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================
   LOADER
========================= */
.loader {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease, visibility 1.2s ease;
}
.loader.hide { opacity: 0; visibility: hidden; }
.loader-title {
    font-size: clamp(80px, 18vw, 260px);
    font-weight: 900; letter-spacing: -15px;
    animation: loaderIn 1.5s cubic-bezier(.2,.8,.2,1);
}
@keyframes loaderIn {
    from { opacity: 0; transform: scale(1.2); filter: blur(20px); }
    to   { opacity: 1; transform: scale(1);   filter: blur(0); }
}

/* =========================
   NAV
========================= */
nav {
    position: fixed; top: 0; left: 0;
    width: 100%; padding: 30px 45px;
    display: flex; justify-content: space-between;
    z-index: 100; mix-blend-mode: difference;
}
.logo { font-size: 20px; font-weight: 800; letter-spacing: 6px; }
.nav-info { font-size: 10px; letter-spacing: 4px; }

/* =========================
   PRESENTATION
========================= */
.presentation { position: relative; }
.scene {
    height: 100vh; position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}

/* =========================
   BACKGROUND
========================= */
.scene-image {
    position: absolute; inset: -5%;
    width: 110%; height: 110%;
    object-fit: cover;
    opacity: 0; transform: scale(1.12);
    filter: brightness(.42) contrast(1.05);
    transition:
        opacity 1.4s cubic-bezier(.2,.7,.2,1),
        transform 2s cubic-bezier(.2,.7,.2,1),
        filter 1.4s ease;
}
.scene.active .scene-image {
    opacity: 1; transform: scale(1);
    filter: brightness(.48) contrast(1.05);
}
.scene::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg,
        rgba(0,0,0,.5),
        rgba(0,0,0,.15) 45%,
        rgba(0,0,0,.7));
    z-index: 1;
}

/* =========================
   TEXT
========================= */
.scene-content {
    position: relative; z-index: 3;
    width: 90%; max-width: 1300px;
    text-align: center;
    opacity: 0; transform: translateY(80px) scale(.96);
    transition:
        opacity 1s ease .15s,
        transform 1.2s cubic-bezier(.2,.7,.2,1);
}
.scene.active .scene-content {
    opacity: 1; transform: translateY(0) scale(1);
}
.scene-number {
    font-size: 10px; letter-spacing: 7px; color: #aaa;
    margin-bottom: 35px;
}
.scene-title {
    font-size: clamp(65px, 12vw, 190px);
    font-weight: 800; line-height: .82; letter-spacing: -9px;
    text-transform: uppercase;
    text-shadow: 0 10px 60px rgba(0,0,0,.5);
}
.scene-subtitle {
    margin-top: 45px;
    font-size: clamp(20px, 3vw, 42px);
    font-weight: 300; letter-spacing: -1px;
}
.scene-description {
    max-width: 600px;
    margin: 25px auto 0;
    color: #bbb;
    font-size: 14px; line-height: 1.7;
}

/* =========================
   FIRST SCENE
========================= */
.scene.first { background: #050505; }
.first .scene-title { font-size: clamp(90px, 18vw, 280px); }

/* =========================
   BREAKTHROUGH BUTTON
========================= */
.breakthrough-btn {
    display: inline-block;
    margin-top: 45px;
    padding: 20px 70px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 12px;
    text-transform: uppercase;
    text-decoration: none;
    color: #fff;
    border: 2px solid #fff;
    background: transparent;
    position: relative;
    overflow: hidden;
    transition:
        color .4s ease,
        letter-spacing .4s ease,
        transform .3s ease;
    cursor: pointer;
    z-index: 5;
}
.breakthrough-btn::before {
    content: "";
    position: absolute; inset: 0;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
    z-index: -1;
}
.breakthrough-btn:hover {
    color: #000;
    letter-spacing: 16px;
    transform: translateY(-2px);
}
.breakthrough-btn:hover::before { transform: scaleX(1); }
.breakthrough-btn:active { transform: translateY(0); }

/* =========================
   SCROLL INDICATOR
========================= */
.scroll-indicator {
    position: absolute; bottom: 35px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    color: #aaa;
    font-size: 9px; letter-spacing: 5px;
    animation: scrollDown 2s infinite;
}
@keyframes scrollDown {
    50% { transform: translateX(-50%) translateY(8px); opacity: .3; }
}

/* =========================
   PROGRESS
========================= */
.progress {
    position: fixed; right: 35px; top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: flex; flex-direction: column; gap: 10px;
}
.progress-dot {
    width: 5px; height: 5px;
    border-radius: 50%; background: #555;
    transition: .4s ease;
}
.progress-dot.active {
    background: white; transform: scale(2);
}

/* =========================
   MOBILE
========================= */
@media(max-width: 700px) {
    nav { padding: 22px; }
    .nav-info { display: none; }
    .scene-title { letter-spacing: -5px; }
    .scene-subtitle { margin-top: 30px; }
    .scene-description { font-size: 13px; padding: 0 15px; }
    .progress { right: 15px; }
    .breakthrough-btn {
        padding: 16px 45px;
        font-size: 14px;
        letter-spacing: 8px;
        margin-top: 35px;
    }
    .breakthrough-btn:hover { letter-spacing: 10px; }
}
</style>
</head>
<body>

<div class="loader" id="loader">
    <div class="loader-title">PETYA</div>
</div>

<nav>
    <div class="logo">PETYA</div>
    <div class="nav-info">DIGITAL INTELLIGENCE</div>
</nav>

<div class="progress" id="progress"></div>

<main class="presentation" id="presentation">

    <section class="scene first">
        <div class="scene-content">
            <div class="scene-number">PETYA / 00</div>
            <div class="scene-title">PETYA</div>
            <div class="scene-description">
                Инструменты анализа открытой информации
                и цифрового следа.
            </div>
            <a href="search.html" class="breakthrough-btn">ПРОБИВ</a>
        </div>
        <div class="scroll-indicator">SCROLL</div>
    </section>

</main>

<script>
const scenes = [
    { image: "1.png", title: "БАЗЫ<br>ДАННЫХ", subtitle: "ОГРОМНЫЙ ВЫБОР БАЗ ДАННЫХ",
      description: "Анализ доступных источников и открытой информации в одном интерфейсе." },
    { image: "2.png", title: "ПОИСК", subtitle: "ЕДИНАЯ ТОЧКА ДОСТУПА",
      description: "Быстрый поиск по разрешённым и публичным источникам." },
    { image: "3.png", title: "АНАЛИЗ", subtitle: "ИНФОРМАЦИЯ В ПОНЯТНОМ ВИДЕ",
      description: "Структурирование результатов и визуальное представление информации." },
    { image: "4.png", title: "СИСТЕМА", subtitle: "ВСЁ В ОДНОМ МЕСТЕ",
      description: "Минималистичный интерфейс для работы с цифровой информацией." },
    { image: "5.png", title: "ПРИВАТНОСТЬ", subtitle: "КОНТРОЛИРУЙ СВОЙ ЦИФРОВОЙ СЛЕД",
      description: "Помогает понять, какая информация о вас доступна публично." }
];

const presentation = document.getElementById("presentation");
scenes.forEach((scene, index) => {
    const section = document.createElement("section");
    section.className = "scene";
    const image = document.createElement("img");
    image.className = "scene-image";
    image.src = "./" + scene.image;
    image.alt = "PETYA";
    image.onerror = () => { section.remove(); updateProgress(); };
    const content = document.createElement("div");
    content.className = "scene-content";
    const number = document.createElement("div");
    number.className = "scene-number";
    number.textContent = `PETYA / ${String(index + 1).padStart(2, "0")}`;
    const title = document.createElement("div");
    title.className = "scene-title";
    title.innerHTML = scene.title;
    const subtitle = document.createElement("div");
    subtitle.className = "scene-subtitle";
    subtitle.textContent = scene.subtitle;
    const description = document.createElement("div");
    description.className = "scene-description";
    description.textContent = scene.description;
    content.appendChild(number);
    content.appendChild(title);
    content.appendChild(subtitle);
    content.appendChild(description);
    section.appendChild(image);
    section.appendChild(content);
    presentation.appendChild(section);
});

const progress = document.getElementById("progress");
function updateProgress() {
    progress.innerHTML = "";
    document.querySelectorAll(".scene").forEach(() => {
        const dot = document.createElement("div");
        dot.className = "progress-dot";
        progress.appendChild(dot);
    });
}
updateProgress();

let currentScene = 0;
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > .5) {
            const sections = [...document.querySelectorAll(".scene")];
            const index = sections.indexOf(entry.target);
            if (index !== -1) {
                currentScene = index;
                entry.target.classList.add("active");
                updateDots(index);
            }
        }
    });
}, { threshold: [.5] });

function observeScenes() {
    document.querySelectorAll(".scene").forEach(s => observer.observe(s));
}
observeScenes();

function updateDots(index) {
    document.querySelectorAll(".progress-dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
    });
}

window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loader").classList.add("hide");
        const first = document.querySelector(".first");
        if (first) first.classList.add("active");
        updateDots(0);
    }, 1700);
});

window.addEventListener("scroll", () => {
    document.querySelectorAll(".scene").forEach(section => {
        const image = section.querySelector(".scene-image");
        if (!image) return;
        const rect = section.getBoundingClientRect();
        const distance = rect.top / window.innerHeight;
        const move = distance * -40;
        if (Math.abs(distance) < 1) {
            image.style.transform = `scale(1.04) translateY(${move}px)`;
        }
    });
}, { passive: true });
</script>
</body>
</html>
