<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Поиск по базам</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #4cafef; margin-top: 0; }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    max-width: 900px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    display: flex;
    gap: 10px;
    flex: 1;
    min-width: 400px;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    background: #1b1f26;
    border: 1px solid #2a2f38;
    border-radius: 8px;
    color: #e6e6e6;
    outline: none;
  }
  input[type="text"]:focus { border-color: #4cafef; }
  input[type="number"] {
    width: 80px;
    padding: 14px 10px;
    font-size: 16px;
    background: #1b1f26;
    border: 1px solid #2a2f38;
    border-radius: 8px;
    color: #e6e6e6;
    outline: none;
    text-align: center;
  }
  input[type="number"]:focus { border-color: #4cafef; }
  button {
    padding: 14px 24px;
    font-size: 16px;
    background: #4cafef;
    color: #0f1115;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #6bc2ff; }
  button:disabled { background: #2a2f38; color: #777; cursor: wait; }
  .field-picker {
    margin-bottom: 20px;
    max-width: 900px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .field-picker label {
    color: #999;
  }
  .field-picker select {
    padding: 10px;
    background: #1b1f26;
    color: #e6e6e6;
    border: 1px solid #2a2f38;
    border-radius: 6px;
    font-size: 14px;
    min-width: 180px;
  }
  .stats {
    padding: 12px 16px;
    background: #1b1f26;
    border-radius: 8px;
    margin-bottom: 20px;
    font-family: monospace;
    font-size: 14px;
    color: #999;
    max-width: 900px;
  }
  .stats b { color: #4cafef; }
  .result {
    background: #1b1f26;
    border-left: 4px solid #4cafef;
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 4px;
    word-break: break-all;
    max-width: 900px;
  }
  .result .source {
    color: #4cafef;
    font-size: 12px;
    margin-bottom: 6px;
    font-family: monospace;
  }
  .result .raw {
    font-family: monospace;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .empty { color: #777; text-align: center; padding: 40px; }
  .error { color: #ff6b6b; padding: 20px; }
  .status { color: #ffaa33; padding: 10px 0; }
</style>
</head>
<body>
  <h1>🔍 Поиск по базам</h1>

  <div class="field-picker">
    <label>Поле:</label>
    <select id="field">
      <option value="">везде (FTS)</option>
      <option value="inn">inn</option>
      <option value="phone">phone</option>
      <option value="fio">fio</option>
      <option value="snils">snils</option>
      <option value="passport">passport</option>
      <option value="email">email</option>
    </select>

    <label>Таймаут базы (сек):</label>
    <input type="number" id="timeout" value="20" min="1" max="300">
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="q" placeholder="Введите номер, ФИО, ИНН..." autofocus>
    </div>
    <button id="go">Искать</button>
  </div>

  <div class="stats" id="stats" style="display:none;"></div>
  <div id="results"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTbyu1HfyZ1ETvidxnexV6pON0gDO-8XQ",
  authDomain: "databaseee-324e7.firebaseapp.com",
  projectId: "databaseee-324e7",
  storageBucket: "databaseee-324e7.firebasestorage.app",
  messagingSenderId: "837279132183",
  appId: "1:837279132183:web:5583196f539916dcf14a52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const qInput = document.getElementById('q');
const fieldSel = document.getElementById('field');
const timeoutInput = document.getElementById('timeout');
const goBtn = document.getElementById('go');
const stats = document.getElementById('stats');
const results = document.getElementById('results');

let currentUnsub = null;

async function doSearch() {
  const q = qInput.value.trim();
  if (!q) return;

  if (currentUnsub) { currentUnsub(); currentUnsub = null; }

  goBtn.disabled = true;
  goBtn.textContent = 'Ищу...';
  stats.style.display = 'none';
  results.innerHTML = '<div class="status">Отправлен запрос на сервер...</div>';

  const field = fieldSel.value;
  let timeout = parseInt(timeoutInput.value) || 20;
  if (timeout < 1) timeout = 1;
  if (timeout > 300) timeout = 300;

  try {
    const reqRef = await addDoc(collection(db, "requests"), {
      query: q,
      field: field,
      timeout: timeout,
      status: "pending",
      createdAt: serverTimestamp(),
    });

    const t0 = performance.now();

    currentUnsub = onSnapshot(doc(db, "requests", reqRef.id), (snap) => {
      const d = snap.data();
      if (!d) return;

      if (d.status === "pending") {
        results.innerHTML = '<div class="status">Запрос в очереди...</div>';
        return;
      }
      if (d.status === "processing") {
        results.innerHTML = '<div class="status">Сервер обрабатывает запрос...</div>';
        return;
      }
      if (d.status === "error") {
        results.innerHTML = `<div class="error">Ошибка: ${d.error || "неизвестно"}</div>`;
        goBtn.disabled = false;
        goBtn.textContent = 'Искать';
        if (currentUnsub) { currentUnsub(); currentUnsub = null; }
        return;
      }
      if (d.status === "done") {
        const dt = Math.round(performance.now() - t0);
        const data = d.result || {};

        stats.style.display = 'block';
        stats.innerHTML = `
          Запрос: <b>${escapeHtml(q)}</b> | Поле: <b>${field || 'все'}</b> | Таймаут: <b>${timeout}s</b><br>
          Баз: <b>${data.total_dbs || 0}</b> | С совпадениями: <b>${data.ok || 0}</b> | Пустых: <b>${data.empty || 0}</b> | Пропущено: <b>${data.timeout || 0}</b> | Ошибок: <b>${data.errors || 0}</b><br>
          Найдено: <b>${(data.results || []).length}</b> | Сервер: <b>${data.time || 0}s</b> | Клиент: <b>${dt}ms</b>
        `;

        const items = data.results || [];
        if (!items.length) {
          results.innerHTML = '<div class="empty">Ничего не найдено</div>';
        } else {
          results.innerHTML = '';
          for (const r of items) {
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = `
              <div class="source">${escapeHtml(r.source)}</div>
              <div class="raw">${escapeHtml(r.raw)}</div>
            `;
            results.appendChild(div);
          }
        }
        goBtn.disabled = false;
        goBtn.textContent = 'Искать';
        if (currentUnsub) { currentUnsub(); currentUnsub = null; }
      }
    });
  } catch (e) {
    results.innerHTML = `<div class="error">Ошибка: ${e.message}</div>`;
    goBtn.disabled = false;
    goBtn.textContent = 'Искать';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

goBtn.addEventListener('click', doSearch);
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
