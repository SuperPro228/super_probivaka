<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПРОБИВ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { min-height: 100%; }
body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    overflow-x: hidden;
}

.overlay {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    padding: 24px 50px 60px;
    animation: overlayIn .6s ease forwards;
    opacity: 0;
}
@keyframes overlayIn { to { opacity: 1; } }

.top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; flex-shrink: 0;
}
.back-btn {
    color: #888; text-decoration: none; font-size: 13px;
    letter-spacing: 2px; padding: 10px 22px;
    border: 1px solid #1e1e1e; border-radius: 999px;
    transition: .3s ease; text-transform: uppercase;
}
.back-btn:hover { color: #fff; border-color: #fff; background: #151515; }
.title { font-size: 12px; letter-spacing: 6px; color: #444; text-transform: uppercase; }

.search-wrap {
    display: flex; gap: 12px;
    max-width: 900px; width: 100%;
    margin: 0 auto 16px; flex-shrink: 0;
}
.search-input {
    flex: 1; background: #141414;
    border: 1px solid #1e1e1e; border-radius: 999px;
    color: #fff; font-family: inherit; font-size: 16px;
    padding: 14px 24px; outline: none; transition: .3s ease;
}
.search-input::placeholder { color: #444; }
.search-input:focus { border-color: #fff; background: #181818; }
.search-btn {
    background: #fff; color: #000; border: none;
    border-radius: 999px; font-family: inherit;
    font-size: 13px; font-weight: 700; padding: 0 32px;
    cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
    transition: .3s ease; flex-shrink: 0;
}
.search-btn:hover { background: #ddd; transform: scale(1.02); }
.search-btn:active { transform: scale(.98); }
.search-btn:disabled { background: #2a2a2a; color: #666; cursor: wait; transform: none; }

.options {
    display: flex; gap: 16px;
    max-width: 900px; margin: 0 auto 40px;
    flex-wrap: wrap; align-items: center;
    font-size: 11px; color: #666;
    letter-spacing: 1px; flex-shrink: 0;
}
.options label { text-transform: uppercase; }
.options select, .options input {
    background: #141414; border: 1px solid #1e1e1e;
    border-radius: 999px; color: #fff;
    font-family: inherit; font-size: 11px;
    padding: 6px 14px; outline: none;
    transition: .3s ease; margin-left: 6px;
}
.options select { padding-right: 26px; }
.options select:focus, .options input:focus { border-color: #fff; }
.options select option { background: #141414; color: #fff; }

.big-query {
    display: none;
    width: 100%;
    max-width: 1400px;
    margin: 30px auto 40px;
    padding: 0 20px;
    text-align: right;
    flex-shrink: 0;
}
.big-query.active {
    display: block;
    animation: queryRise 1s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes queryRise {
    0%   { opacity: 0; transform: translateY(80px); filter: blur(12px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0); }
}
.big-query .value {
    font-size: clamp(56px, 12vw, 190px);
    font-weight: 900;
    letter-spacing: -6px;
    line-height: 1;
    color: #fff;
    word-break: break-all;
    display: inline-block;
}
.big-query .count {
    margin-top: 28px;
    font-size: 14px;
    color: #666;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.status-text {
    text-align: center; color: #666; font-size: 12px;
    letter-spacing: 5px; padding: 40px 0;
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
}
@keyframes pulse {
    0%, 100% { opacity: .4; }
    50%      { opacity: 1; }
}
.status-text.error { color: #ff5555; animation: none; }

/* СПИСОК БАЗ ВНИЗ */
.results {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 20px 120px;
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.db-block {
    background: #101010;
    border: 1px solid #1c1c1c;
    border-radius: 24px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(60px);
    transition:
        opacity .8s cubic-bezier(.2,.8,.2,1),
        transform .9s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease;
}
.db-block.visible { opacity: 1; transform: translateY(0); }
.db-block:hover { border-color: #2a2a2a; }

.db-header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 26px;
    background: #141414;
    border-bottom: 1px solid #1c1c1c;
}

.db-logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1e1e1e, #0d0d0d);
    border: 1px solid #262626;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
    overflow: hidden;
}
.db-logo img {
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 6px;
    display: block;
}

.db-info {
    display: flex; flex-direction: column; gap: 4px;
    overflow: hidden; flex: 1;
}
.db-name {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.db-sub {
    font-size: 11px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.db-count {
    background: #1e1e1e;
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 12px;
    color: #ccc;
    font-weight: 700;
    letter-spacing: 1px;
    flex-shrink: 0;
}

/* ДАННЫЕ — СПИСОК ВНИЗ */
.db-data {
    padding: 4px 26px 22px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.data-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    transition: .25s ease;
    border-bottom: 1px solid #161616;
}
.data-row:last-child { border-bottom: none; }
.data-row:hover { background: #161616; }

.data-row .key {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    flex-shrink: 0;
    min-width: 140px;
    padding-top: 3px;
}
.data-row .val {
    font-size: 15px;
    color: #fff;
    font-family: 'SF Mono', Monaco, Consolas, monospace;
    line-height: 1.4;
    word-break: break-all;
    flex: 1;
}

.empty {
    text-align: center; color: #444;
    font-size: 13px; letter-spacing: 4px;
    padding: 60px 0; text-transform: uppercase;
}

@media (max-width: 700px) {
    .overlay { padding: 16px 12px 40px; }
    .search-wrap { flex-direction: column; }
    .search-btn { padding: 12px; width: 100%; }
    .big-query { text-align: right; padding: 0 8px; }
    .big-query .value {
        font-size: clamp(40px, 14vw, 90px);
        letter-spacing: -3px;
    }
    .big-query .count { font-size: 11px; letter-spacing: 2px; }
    .results { padding: 10px 0 80px; gap: 18px; }
    .db-header { padding: 14px 16px; gap: 12px; }
    .db-logo { width: 52px; height: 52px; border-radius: 14px; font-size: 26px; }
    .db-name { font-size: 16px; }
    .db-count { font-size: 11px; padding: 4px 12px; }
    .db-data { padding: 4px 14px 16px; }
    .data-row { flex-direction: column; gap: 4px; padding: 12px 12px; }
    .data-row .key { min-width: 0; padding-top: 0; font-size: 10px; }
    .data-row .val { font-size: 14px; }
}
</style>
</head>
<body>

<div class="overlay">

    <div class="top-bar">
        <a href="index.html" class="back-btn">← Назад</a>
        <div class="title">PETYA / ПРОБИВ</div>
    </div>

    <div class="search-wrap">
        <input type="text" id="q" class="search-input" placeholder="Введите запрос..." autofocus autocomplete="off">
        <button id="go" class="search-btn">Пробить</button>
    </div>

    <div class="options">
        <label>Поле:
            <select id="field">
                <option value="">ВСЕ (FTS)</option>
                <option value="inn">ИНН</option>
                <option value="phone">ТЕЛЕФОН</option>
                <option value="telegram_id">TELEGRAM ID</option>
                <option value="snils">СНИЛС</option>
                <option value="passport">ПАСПОРТ</option>
                <option value="fio">ФИО</option>
                <option value="surname">ФАМИЛИЯ</option>
                <option value="name">ИМЯ</option>
                <option value="middle_name">ОТЧЕСТВО</option>
                <option value="username">USERNAME</option>
                <option value="nickname">NICKNAME</option>
                <option value="dob">ДАТА РОЖДЕНИЯ</option>
                <option value="birth_date">BIRTH_DATE</option>
                <option value="birthday">BIRTHDAY</option>
                <option value="address">АДРЕС</option>
                <option value="email">EMAIL</option>
                <option value="polis">ПОЛИС</option>
                <option value="policy">POLICY</option>
                <option value="policy_num">POLICY_NUM</option>
                <option value="doc">DOC</option>
                <option value="doc_number">DOC_NUMBER</option>
                <option value="mobile">МОБИЛЬНЫЙ</option>
                <option value="full_name">FULL_NAME</option>
                <option value="yandex_id">YANDEX ID</option>
                <option value="msisdn">MSISDN</option>
                <option value="uid">UID</option>
                <option value="id">ID</option>
                <option value="login">LOGIN</option>
            </select>
        </label>

        <label>Таймаут:
            <input type="number" id="timeout" value="20" min="1" max="300" style="width:60px; text-align:center;">
        </label>
    </div>

    <div class="big-query" id="big-query">
        <div class="value" id="big-query-value">—</div>
        <div class="count" id="big-query-count"></div>
    </div>

    <div class="results" id="results"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTbyu1HfyZ1ETvidxnexV6pON0gDO-8XQ",
    authDomain: "databaseee-324e7.firebaseapp.com",
    projectId: "databaseee-324e7",
    storageBucket: "databaseee-324e7.firebasestorage.app",
    messagingSenderId: "837279132183",
    appId: "1:837279132183:web:5583196f539916dcf14a52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const qInput    = document.getElementById('q');
const fieldSel  = document.getElementById('field');
const timeoutIn = document.getElementById('timeout');
const goBtn     = document.getElementById('go');
const results   = document.getElementById('results');
const bigQuery  = document.getElementById('big-query');
const bigQueryValue = document.getElementById('big-query-value');
const bigQueryCount = document.getElementById('big-query-count');

let currentUnsub = null;

/* ==============================
   LOGO MAP — какие PNG использовать
   ============================== */
const LOGO_MAP = [
    { match: /mvd/i,                    file: "mvd.png",          emoji: "🛡" },
    { match: /gosuslugi|gos_uslugi/i,   file: "gosuslugi.png",    emoji: "🇷🇺" },
    { match: /nalogru|nalog/i,          file: "nalogru.png",      emoji: "💰" },
    { match: /foms/i,                   file: "foms.png",         emoji: "🏥" },
    { match: /sber/i,                   file: "sber.png",         emoji: "🏦" },
    { match: /sdek/i,                   file: "sdek.png",         emoji: "📦" },
    { match: /fargo/i,                  file: "fargo.png",        emoji: "🚚" },
    { match: /yandex/i,                 file: "yandex.png",       emoji: "🌐" },
    { match: /whoosh/i,                 file: "whoosh.png",       emoji: "🛴" },
    { match: /tele2/i,                  file: "tele2.png",        emoji: "📱" },
    { match: /bilain/i,                 file: "bilain.png",       emoji: "📞" },
    { match: /tg[_\d]|telegram/i,       file: "tg.png",           emoji: "✈" },
    { match: /kreditkz|kredit/i,        file: "kreditkz.png",     emoji: "📊" },
    { match: /zhiteli_kz|zhiteli/i,     file: "zhiteli_kz.png",   emoji: "🏘" },
    { match: /reg_kz|registration.*kz/i,file: "reg_kz.png",       emoji: "📝" },
    { match: /rodstven/i,               file: "rodstvenniki.png", emoji: "👥" },
    { match: /egaz/i,                   file: "egaz.png",         emoji: "🔥" },
    { match: /avia/i,                   file: "avia.png",         emoji: "✈" },
    { match: /zakazy/i,                 file: "zakazy.png",       emoji: "🛒" },
    { match: /kriptopro|cryptopro/i,    file: "kriptopro.png",    emoji: "🔐" },
    { match: /postgres/i,               file: "postgres.png",     emoji: "🐘" },
];

function getLogoInfo(source) {
    for (const item of LOGO_MAP) {
        if (item.match.test(source)) return item;
    }
    return { file: "default.png", emoji: "🗄" };
}

/* красивое имя базы */
function prettyName(source) {
    return source
        .replace(/\.db$/i, "")
        .replace(/^database[_\s]*/i, "")
        .replace(/_/g, " ")
        .toUpperCase();
}

/* вставка логотипа — с fallback на эмодзи */
function renderLogo(container, source) {
    const info = getLogoInfo(source);
    const img = document.createElement('img');
    img.src = info.file;
    img.alt = "";
    img.onerror = () => {
        img.remove();
        container.textContent = info.emoji;
    };
    container.innerHTML = '';
    container.appendChild(img);
}

/* IntersectionObserver */
const blockObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            blockObserver.unobserve(entry.target);
        }
    });
}, { threshold: 0.05, rootMargin: '0px 0px -60px 0px' });

async function doSearch() {
    const q = qInput.value.trim();
    if (!q) return;
    if (currentUnsub) { currentUnsub(); currentUnsub = null; }

    goBtn.disabled = true;
    goBtn.textContent = 'Идёт пробив...';
    bigQuery.classList.remove('active');
    results.innerHTML = '<div class="status-text">Отправка запроса...</div>';

    const field = fieldSel.value;
    let timeout = parseInt(timeoutIn.value) || 20;
    if (timeout < 1) timeout = 1;
    if (timeout > 300) timeout = 300;

    try {
        const reqRef = await addDoc(collection(db, "requests"), {
            query: q,
            field: field,
            timeout: timeout,
            status: "pending",
            createdAt: serverTimestamp(),
        });

        currentUnsub = onSnapshot(doc(db, "requests", reqRef.id), (snap) => {
            const d = snap.data();
            if (!d) return;

            if (d.status === "pending") {
                results.innerHTML = '<div class="status-text">Запрос в очереди...</div>';
                return;
            }
            if (d.status === "processing") {
                results.innerHTML = '<div class="status-text">Поиск по базам...</div>';
                return;
            }
            if (d.status === "error") {
                results.innerHTML = `<div class="status-text error">Ошибка: ${escapeHtml(d.error || "неизвестно")}</div>`;
                goBtn.disabled = false;
                goBtn.textContent = 'Пробить';
                if (currentUnsub) { currentUnsub(); currentUnsub = null; }
                return;
            }
            if (d.status === "done") {
                const data = d.result || {};
                const items = data.results || [];

                bigQueryValue.textContent = q;
                if (items.length > 0) {
                    bigQueryCount.textContent = `Найдено: ${items.length} | Баз: ${data.ok || 0} из ${data.total_dbs || 0} | Время: ${data.time || 0}s`;
                } else {
                    bigQueryCount.textContent = `Ничего не найдено | Баз проверено: ${data.total_dbs || 0} | Время: ${data.time || 0}s`;
                }

                bigQuery.classList.remove('active');
                void bigQuery.offsetWidth;
                bigQuery.classList.add('active');

                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 100);

                if (!items.length) {
                    results.innerHTML = '<div class="empty">Ничего не найдено</div>';
                } else {
                    const grouped = {};
                    for (const r of items) {
                        if (!grouped[r.source]) grouped[r.source] = [];
                        grouped[r.source].push(r);
                    }

                    results.innerHTML = '';

                    for (const [source, rows] of Object.entries(grouped)) {
                        const block = document.createElement('div');
                        block.className = 'db-block';

                        /* заголовок */
                        const header = document.createElement('div');
                        header.className = 'db-header';

                        const logo = document.createElement('div');
                        logo.className = 'db-logo';
                        renderLogo(logo, source);

                        const info = document.createElement('div');
                        info.className = 'db-info';

                        const name = document.createElement('div');
                        name.className = 'db-name';
                        name.textContent = prettyName(source);

                        const sub = document.createElement('div');
                        sub.className = 'db-sub';
                        sub.textContent = source;

                        info.appendChild(name);
                        info.appendChild(sub);

                        const count = document.createElement('div');
                        count.className = 'db-count';
                        count.textContent = `${rows.length} ${rows.length === 1 ? 'запись' : 'записей'}`;

                        header.appendChild(logo);
                        header.appendChild(info);
                        header.appendChild(count);

                        /* данные — список вниз */
                        const dataWrap = document.createElement('div');
                        dataWrap.className = 'db-data';

                        for (let ri = 0; ri < rows.length; ri++) {
                            const r = rows[ri];

                            if (r.fields && r.fields.length) {
                                for (const f of r.fields) {
                                    const row = document.createElement('div');
                                    row.className = 'data-row';
                                    row.innerHTML = `
                                        <div class="key">${escapeHtml(f.name)}</div>
                                        <div class="val">${escapeHtml(f.value)}</div>
                                    `;
                                    dataWrap.appendChild(row);
                                }
                            } else {
                                const row = document.createElement('div');
                                row.className = 'data-row';
                                row.innerHTML = `
                                    <div class="key">Строка</div>
                                    <div class="val">${escapeHtml(r.raw)}</div>
                                `;
                                dataWrap.appendChild(row);
                            }

                            if (ri < rows.length - 1) {
                                const sep = document.createElement('div');
                                sep.style.height = '1px';
                                sep.style.background = '#1a1a1a';
                                sep.style.margin = '12px 0 6px';
                                dataWrap.appendChild(sep);
                            }
                        }

                        block.appendChild(header);
                        block.appendChild(dataWrap);
                        results.appendChild(block);
                        blockObserver.observe(block);
                    }
                }

                goBtn.disabled = false;
                goBtn.textContent = 'Пробить';
                if (currentUnsub) { currentUnsub(); currentUnsub = null; }
            }
        });
    } catch (e) {
        results.innerHTML = `<div class="status-text error">Ошибка: ${escapeHtml(e.message)}</div>`;
        goBtn.disabled = false;
        goBtn.textContent = 'Пробить';
    }
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

goBtn.addEventListener('click', doSearch);
qInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
